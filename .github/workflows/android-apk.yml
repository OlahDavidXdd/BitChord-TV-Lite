name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [tv-fixes]
    paths: ['android-integration/**', '.github/workflows/android-apk.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: android-actions/setup-android@v3
        with: { packages: '' }
      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --list 2>/dev/null | grep -E "platforms;android-3[67]" | head
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1" "platform-tools"
          sdkmanager "platforms;android-37.0" || sdkmanager "platforms;android-37" || true
      - name: Build APK
        run: bash android-integration/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: BitChord-Android-arm64
          path: android-integration/build/BitChord/app/build/outputs/apk/prod/release/*.apk
